# Publishes /docs to GitHub Pages (same URL pattern as branch-based Pages:
# https://<owner>.github.io/<repo>/).
#
# One-time repo setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# After that, every push to main redeploys the SPA.

name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # SPA loads JSON from same-origin /baseline/ first (avoids relying on raw.githubusercontent.com).
      - name: Bundle baseline JSON into published site
        run: rm -rf docs/baseline && cp -r baseline docs/baseline

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
